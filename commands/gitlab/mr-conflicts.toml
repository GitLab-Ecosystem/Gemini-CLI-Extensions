description = "Get merge request conflicts."
prompt = """
User arguments: "{{args}}"
1. Parse the arguments as "<project_id> <merge_request_iid>".
2. If either value is missing, ask the user to rerun with both the project identifier and the merge request IID.
3. Call the `gitlab.get_merge_request_conflicts` tool with:
   {
     "project_id": "<project_id>",
     "merge_request_iid": "<merge_request_iid>"
   }
4. Summarize the conflicts found in the merge request.
"""
